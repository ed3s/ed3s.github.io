<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>UTM Generator | ed3s.com</title>

  <!-- IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel: #0a0a0a;
      --field: #111111;
      --border: #292929;
      --text: #f5f5f5;
      --muted: #929292;
      --button-bg: #151515;
      --button-hover: #252525;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      min-height: 100vh;
      font-family: "IBM Plex Sans Arabic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.9;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 30px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .header {
      margin-bottom: 28px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      margin-bottom: 12px;
      border: 1px solid #444444;
      border-radius: 10px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px;
      color: #ffffff;
    }

    .description {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    .utm-tag {
      display: inline-block;
      direction: ltr;
      unicode-bidi: isolate;
      padding: 4px 10px;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #111111;
      color: #dddddd;
      font: 12px monospace;
      overflow-wrap: anywhere;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin: 22px 0 9px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 180px;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--field);
      color: var(--text);
      font: 400 14px/2 "IBM Plex Sans Arabic", sans-serif;
      resize: vertical;
      outline: none;
      direction: auto;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #777777;
    }

    textarea::placeholder {
      color: #686868;
    }

    #output {
      min-height: 220px;
      background: #080808;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    /* جميع الأزرار بلون موحّد */
    button {
      appearance: none;
      background: var(--button-bg);
      color: #eeeeee;
      border: 1px solid #292929;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font: 600 14px "IBM Plex Sans Arabic", sans-serif;
      transition:
        background 0.2s,
        border-color 0.2s,
        color 0.2s;
    }

    button:hover {
      background: var(--button-hover);
      color: #ffffff;
      border-color: #444444;
    }

    button:active {
      background: #303030;
    }

    button:focus-visible {
      outline: 2px solid #aaaaaa;
      outline-offset: 3px;
    }

    .status {
      margin-top: 14px;
      font-size: 13px;
      color: #bdbdbd;
      min-height: 25px;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #666666;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 10px;
      }

      .container {
        padding: 20px 14px;
        border-radius: 12px;
      }

      h1 {
        font-size: 22px;
      }

      .buttons button {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo">U</div>

      
    </header>

    <section>
      <label for="input">النص أو الروابط الأصلية</label>

      <textarea
        id="input"
        placeholder="ضع الروابط أو النص هنا...

"
      ></textarea>

      <div class="buttons">
        <button type="button" id="processBtn">
          إضافة UTM
        </button>

        <button type="button" id="pasteBtn">
          لصق من الحافظة
        </button>

        <button type="button" id="clearBtn">
          مسح الكل
        </button>
      </div>
    </section>

    <section>
      <label for="output">النتيجة بعد التعديل</label>

      <textarea
        id="output"
        readonly
        placeholder="ستظهر النتيجة هنا..."
        spellcheck="false"
      ></textarea>

      <div class="buttons">
        <button type="button" id="copyAllBtn">
          نسخ النص كاملًا
        </button>

        <button type="button" id="copyLinksBtn">
          نسخ الروابط فقط
        </button>
      </div>

      <div
        class="status"
        id="status"
        role="status"
        aria-live="polite"
      ></div>
    </section>

    <footer class="footer">
      UTM Generator · ed3s.com
    </footer>

  </main>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    const UTM_KEY = "utm_source";
    const UTM_VALUE = "ed3s.com";

    
    function processText(text) {
      const urlPattern = /https?:\/\/[^\s<>"']+/gi;

      return text.replace(urlPattern, (original) => {
        let url = original;
        let ending = "";

        
        while (/[.,،؛;!؟?)\]}]$/.test(url)) {
          ending = url.slice(-1) + ending;
          url = url.slice(0, -1);
        }

        try {
          const parsed = new URL(url);

          if (!["http:", "https:"].includes(parsed.protocol)) {
            return original;
          }

          
          if (!parsed.searchParams.has(UTM_KEY)) {
            parsed.searchParams.append(UTM_KEY, UTM_VALUE);
          }

          return parsed.href + ending;
        } catch {
          return original;
        }
      });
    }

    
    function updateOutput() {
      output.value = processText(input.value);

      status.textContent = input.value.trim()
        ? "تم تحديث الروابط تلقائيًا."
        : "";
    }

    input.addEventListener("input", updateOutput);

    
    document.getElementById("processBtn").addEventListener(
      "click",
      updateOutput
    );

    
    document.getElementById("pasteBtn").addEventListener(
      "click",
      async () => {
        try {
          if (!navigator.clipboard?.readText) {
            throw new Error("Clipboard unavailable");
          }

          const clipboardText =
            await navigator.clipboard.readText();

          if (!clipboardText.trim()) {
            status.textContent = "الحافظة فارغة.";
            return;
          }

          input.value = clipboardText;
          updateOutput();
          input.focus();

          status.textContent =
            "تم اللصق وإضافة UTM بنجاح.";
        } catch {
          status.textContent =
            "تعذّر الوصول للحافظة. تحقق من إذن المتصفح أو الصق النص يدويًا.";
        }
      }
    );

    
    document.getElementById("clearBtn").addEventListener(
      "click",
      () => {
        input.value = "";
        output.value = "";
        status.textContent = "تم مسح المحتوى.";
        input.focus();
      }
    );

    
    async function copyText(text, message) {
      if (!text.trim()) {
        status.textContent = "لا يوجد محتوى لنسخه.";
        return;
      }

      try {
        if (!navigator.clipboard?.writeText) {
          throw new Error("Clipboard unavailable");
        }

        await navigator.clipboard.writeText(text);
        status.textContent = message;
      } catch {
        const helper = document.createElement("textarea");

        helper.value = text;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        helper.style.pointerEvents = "none";

        document.body.appendChild(helper);
        helper.focus();
        helper.select();

        let copied = false;

        try {
          copied = document.execCommand("copy");
        } catch {
          copied = false;
        }

        helper.remove();

        status.textContent = copied
          ? message
          : "تعذّر النسخ تلقائيًا. يرجى النسخ يدويًا.";
      }
    }

    
    document.getElementById("copyAllBtn").addEventListener(
      "click",
      () => {
        copyText(
          output.value,
          "تم نسخ النص كاملًا بنجاح."
        );
      }
    );

    
    document.getElementById("copyLinksBtn").addEventListener(
      "click",
      () => {
        const links = output.value.match(
          /https?:\/\/[^\s<>"']+/gi
        ) || [];

        const uniqueLinks = [...new Set(links)];

        copyText(
          uniqueLinks.join("\n"),
          `تم نسخ ${uniqueLinks.length} رابط بنجاح.`
        );
      }
    );
  </script>
</body>
</html>
